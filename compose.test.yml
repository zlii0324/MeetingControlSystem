name: meeting-control-test

x-jitsi-common: &jitsi-common
  TZ: Asia/Shanghai
  PUBLIC_URL: http://localhost:8000
  XMPP_DOMAIN: meet.jitsi
  XMPP_AUTH_DOMAIN: auth.meet.jitsi
  XMPP_GUEST_DOMAIN: guest.meet.jitsi
  XMPP_MUC_DOMAIN: muc.meet.jitsi
  XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
  XMPP_SERVER: xmpp.meet.jitsi
  XMPP_PORT: 5222

services:
  # 测试邮件服务器：SMTP 捕获邮件，Web 页面查看邮件。
  mail:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - test-network

  # 应用服务器：后端 API + 前端反向代理。
  app-backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5001
      DATABASE_PATH: /app/instance/meetings.sqlite3
      JITSI_BASE_URL: http://localhost:8000/
      ROOM_PREFIX: mcs-test
      FRONTEND_ORIGIN: http://localhost:8080
      MEETING_LINK_ORIGIN: http://localhost:8080
      PASSWORD_SECRET: docker-test-only-secret-change-before-production
      DEFAULT_DURATION_HOURS: 24
      DEFAULT_MAX_OCCUPANTS: 30
      RESERVATION_EARLY_JOIN_MINUTES: 15
      ENABLE_CORS: "true"
      SESSION_COOKIE_SECURE: "false"
      EMAIL_NOTIFICATIONS_ENABLED: "true"
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SMTP_USE_TLS: "false"
      SMTP_USE_SSL: "false"
      SMTP_TIMEOUT_SECONDS: 10
      EMAIL_FROM: meetings@test.local
      EMAIL_FROM_NAME: 会议管理系统（Docker 测试）
      EMAIL_TIMEZONE: Asia/Shanghai
    volumes:
      - app-data:/app/instance
    depends_on:
      - mail
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - test-network

  app-web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app-backend:
        condition: service_healthy
    networks:
      - test-network

  # Jitsi 测试服务器：官方建议的 Web、Prosody、Jicofo、JVB 四组件。
  jitsi-web:
    image: jitsi/web:stable-10978
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    environment:
      <<: *jitsi-common
      ENABLE_AUTH: "0"
      ENABLE_GUESTS: "1"
      ENABLE_HTTP_REDIRECT: "0"
      ENABLE_LETSENCRYPT: "0"
      ENABLE_PREJOIN_PAGE: "1"
      ENABLE_WELCOME_PAGE: "1"
      BOSH_RELATIVE: "1"
      ENABLE_XMPP_WEBSOCKET: "0"
      ENABLE_COLIBRI_WEBSOCKET: "0"
      DISABLE_HTTPS: "1"
    volumes:
      - jitsi-web-config:/config
      - jitsi-web-crontabs:/var/spool/cron/crontabs
      - jitsi-web-transcripts:/usr/share/jitsi-meet/transcripts
    depends_on:
      - prosody
    networks:
      - test-network

  prosody:
    image: jitsi/prosody:stable-10978
    restart: unless-stopped
    environment:
      <<: *jitsi-common
      AUTH_TYPE: internal
      ENABLE_AUTH: "0"
      ENABLE_GUESTS: "1"
      ENABLE_LOBBY: "1"
      ENABLE_XMPP_WEBSOCKET: "0"
      JICOFO_AUTH_PASSWORD: 4CVnE8E3w6gECbEDywx8qUj2hVDNUQKm
      JVB_AUTH_PASSWORD: 9o8h4VfQoPBe6BgGNe4kbZsnDYFN6JGd
    volumes:
      - jitsi-prosody-config:/config
      - jitsi-prosody-plugins:/prosody-plugins-custom
    networks:
      test-network:
        aliases:
          - xmpp.meet.jitsi

  jicofo:
    image: jitsi/jicofo:stable-10978
    restart: unless-stopped
    environment:
      <<: *jitsi-common
      AUTH_TYPE: internal
      ENABLE_AUTH: "0"
      JICOFO_AUTH_PASSWORD: 4CVnE8E3w6gECbEDywx8qUj2hVDNUQKm
      JVB_BREWERY_MUC: jvbbrewery
    volumes:
      - jitsi-jicofo-config:/config
    depends_on:
      - prosody
    networks:
      - test-network

  jvb:
    image: jitsi/jvb:stable-10978
    restart: unless-stopped
    ports:
      - "127.0.0.1:10000:10000/udp"
    environment:
      <<: *jitsi-common
      ENABLE_COLIBRI_WEBSOCKET: "0"
      JVB_ADVERTISE_IPS: 127.0.0.1
      JVB_AUTH_PASSWORD: 9o8h4VfQoPBe6BgGNe4kbZsnDYFN6JGd
      JVB_BREWERY_MUC: jvbbrewery
      JVB_PORT: 10000
    volumes:
      - jitsi-jvb-config:/config
    depends_on:
      - prosody
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  app-data:
  jitsi-web-config:
  jitsi-web-crontabs:
  jitsi-web-transcripts:
  jitsi-prosody-config:
  jitsi-prosody-plugins:
  jitsi-jicofo-config:
  jitsi-jvb-config:
