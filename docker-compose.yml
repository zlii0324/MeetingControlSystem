services:
  backend:
    build:
      context: ./backend
    container_name: meeting-backend
    environment:
      PORT: 5001
      DATABASE_PATH: /app/instance/meetings.sqlite3
      JITSI_BASE_URL: https://meet.wusupower.com/
      ROOM_PREFIX: mcs
      FRONTEND_ORIGIN: http://localhost
      PASSWORD_SECRET: change-this-long-random-secret-before-production
      DEFAULT_DURATION_HOURS: 24
      DEFAULT_MAX_OCCUPANTS: 30
      RESERVATION_EARLY_JOIN_MINUTES: 15
      ENABLE_CORS: true
    volumes:
      - ./backend/instance:/app/instance
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./frontend
    container_name: meeting-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
